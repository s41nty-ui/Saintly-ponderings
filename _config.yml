# Site builder settings (GitHub Pages runs Jekyll on this repo).
# Articles live in one folder per section (_match-reports, _news-politics, _worldwide, _musings)
# and are edited through Pages CMS (.pages.yml). Each keeps the address /<section>/<file name>.html.

title: Saintly Ponderings
url: https://philipsaint.com
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  match-reports:
    output: true
    permalink: /match-reports/:name.html
  news-politics:
    output: true
    permalink: /news-politics/:name.html
  worldwide:
    output: true
    permalink: /worldwide/:name.html
  musings:
    output: true
    permalink: /musings/:name.html

defaults:
  - scope: { path: "", type: match-reports }
    values: { layout: article }
  - scope: { path: "", type: news-politics }
    values: { layout: article }
  - scope: { path: "", type: worldwide }
    values: { layout: article }
  - scope: { path: "", type: musings }
    values: { layout: article }

exclude:
  - CLAUDE.md
  - "temporary screenshots"
  - node_modules
  - README.md
