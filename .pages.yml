  - name: sections
    label: "Sections (homepage headings)"
    type: file
    path: _data/sections.yml
    fields:
      - name: sections
        label: Sections
        description: "In homepage order: drag to reorder. To add or remove a section, ask Claude."
        type: object
        list:
          min: 4
          max: 4
        fields:
