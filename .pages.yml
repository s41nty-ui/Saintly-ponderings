# Pages CMS (https://app.pagescms.org) editor setup for Saintly Ponderings.
# One list per homepage section; each article is a file in that section's folder.
media:
  input: brand_assets
  output: /brand_assets

content:
  - name: match-reports
    label: "Match Reports"
    type: collection
    path: _match-reports
    filename: "{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: image
        label: Picture
        type: image
      - name: image_alt
        label: Picture description (for screen readers and Google)
        type: string
      - name: image_fit
        label: Picture fit
        type: select
        default: "Fill the frame"
        options:
          values: ["Fill the frame", "Show the whole picture", "Narrow (portrait photos)"]
      - name: heading
        label: Heading beside the picture
        type: string
      - name: body
        label: Text
        type: rich-text
      - name: image_position
        label: "Advanced: picture position"
        description: "Which part of the picture to keep when it is cropped, e.g. 50% 30% (across, down). Leave as is if unsure."
        type: string
        default: "62% 30%"
      - name: image_background
        label: "Advanced: colour behind the picture"
        description: "Only shows with 'Show the whole picture' (not 'Narrow'), e.g. #181818 for the dark scoreboards."
        type: string

