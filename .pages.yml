            label: Heading
            type: string
            required: true
          - name: sub
            label: Subheading (optional)
            type: string
          - name: icon
            label: Logo beside the heading
            type: image
          - name: grey
            label: Grey background
            type: boolean
          - name: all
            label: "\"All...\" button wording"
            type: string
          - name: back
            label: "Back button wording on article pages"
            type: string
          - name: collection
            label: "Technical: article folder (don't change)"
            type: string
            readonly: true
          - name: id
            label: "Technical: link name (don't change)"
            type: string
            readonly: true
